name: accessibility_assistant
description: Accessible AI assistant mobile app.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  camera: ^0.10.5
  geolocator: ^11.0.0
  google_fonts: ^6.1.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  permission_handler: ^11.0.0
  url_launcher: ^6.2.0
  intl: ^0.19.0
  pointer_interceptor: ^0.10.1
  tflite_flutter: ^0.12.0
  flutter_foreground_task: ^11.0.1
  flutter_local_notifications: ^22.3.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.0.0
  sensors_plus: ^6.1.1
  pedometer: ^4.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/icon.jpg"
  image_path: "assets/icon.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icon.jpg
    - assets/icon.png
    - assets/icon_in_app.png
    - assets/App_Icon_Generation_3.png
