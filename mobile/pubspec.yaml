name: accessibility_assistant
description: Accessible AI assistant mobile app.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  camera: ^0.10.5
  geolocator: ^11.0.0
  google_fonts: ^6.1.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  permission_handler: ^11.0.0
  url_launcher: ^6.2.0
  intl: ^0.19.0
  pointer_interceptor: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
